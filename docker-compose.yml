services:
  orchestrator-service:
    build: ./apps/orchestrator-service
    ports:
      - "8000:8000"
    env_file:
      - ./apps/orchestrator-service/.env
    depends_on:
      - catalog-service
      - seller-crosspost-service
      - media-service
    networks:
      - talknshop-network

  catalog-service:
    build: ./apps/catalog-service
    ports:
      - "8002:8002"
    env_file:
      - ./apps/catalog-service/.env
    networks:
      - talknshop-network

  seller-crosspost-service:
    build: ./apps/seller-crosspost-service
    ports:
      - "8003:8003"
    env_file:
      - ./apps/seller-crosspost-service/.env
    networks:
      - talknshop-network

  media-service:
    build: ./apps/media-service
    ports:
      - "8001:8001"
    env_file:
      - ./apps/media-service/.env
    networks:
      - talknshop-network

  asl-service:
    build: ./apps/asl-service
    ports:
      - "8004:8004"
    env_file:
      - ./apps/asl-service/.env
    volumes:
      # Mount the WLASL repo so the container can import I3D code and class lists
      - ../WLASL:/app/WLASL:ro
      # Mount the pretrained WLASL I3D checkpoint used by ASL_MODEL_PATH
      - /Users/rutujanemane/Documents/SJSU/SEM3/295A/WLASL/code/I3D/archived/asl2000/FINAL_nslt_2000_iters=5104_top1=32.48_top5=57.31_top10=66.31.pt:/app/models/wlasl_nslt_2000.pt:ro
    networks:
      - talknshop-network

networks:
  talknshop-network:
    driver: bridge
